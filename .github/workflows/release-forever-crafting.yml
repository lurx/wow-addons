# Builds and publishes a Forever Crafting release whenever the version in
# ForeverCrafting.toc changes on main (or when run by hand from the Actions tab).
# Versions ending in -dev are work in progress and are skipped. Versions with
# any other suffix, like 0.9.0-beta, are published as pre-releases.
# All modules share the core's version. The zip holds the core and every module.
name: Release Forever Crafting

on:
  push:
    branches: [main]
    paths:
      - "forever-crafting/ForeverCrafting*/**"
      - "forever-crafting/RELEASE_NOTES.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from the .toc
        id: v
        run: |
          version=$(grep -m1 '^## Version:' forever-crafting/ForeverCrafting/ForeverCrafting.toc | awk '{print $3}' | tr -d '\r')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=forever-crafting-v$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "pre=--prerelease" >> "$GITHUB_OUTPUT"; else echo "pre=" >> "$GITHUB_OUTPUT"; fi

      - name: Skip dev builds and versions already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ steps.v.outputs.version }}" == *-dev* ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif gh release view "${{ steps.v.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the zip
        if: steps.check.outputs.exists == 'false'
        run: |
          cd forever-crafting
          zip -r "../ForeverCrafting-${{ steps.v.outputs.version }}.zip" ForeverCrafting ForeverCrafting_*

      - name: Publish the release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.v.outputs.tag }}" \
            "ForeverCrafting-${{ steps.v.outputs.version }}.zip" \
            --target "$GITHUB_SHA" \
            --title "Forever Crafting ${{ steps.v.outputs.version }}" \
            --notes-file forever-crafting/RELEASE_NOTES.md \
            ${{ steps.v.outputs.pre }}
